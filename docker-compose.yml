# Production: CORTEX + corpus-tuned leonardo-museum SLM (qwen2.5:1.5b base).
services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: "-1"
      OLLAMA_NUM_PARALLEL: "1"
    deploy:
      resources:
        limits:
          memory: 7G

  app:
    build: .
    restart: unless-stopped
    depends_on:
      - ollama
    environment:
      PORT: "8080"
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-leonardo-museum}
      OLLAMA_BASE_MODEL: ${OLLAMA_BASE_MODEL:-qwen2.5:1.5b}
      OLLAMA_PULL_ON_START: "1"
      USE_OLLAMA: "1"
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    ports:
      - "${APP_PORT:-8080}:8080"

volumes:
  ollama_data:
